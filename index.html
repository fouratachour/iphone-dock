<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dock">
<meta name="theme-color" content="#000000">
<title>Dock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background: #0b1020;
    -webkit-user-select: none; user-select: none;
    transition: background 2s ease;
  }
  #sky { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  #shade { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 30% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,.18) 100%); }
  body.dim #shade { background: rgba(0,0,0,.6); transition: background 2s ease; }
  #app { position: relative; z-index: 1; text-shadow: 0 2px 14px rgba(0,0,0,.28); }

  #app {
    height: 100%;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    grid-template-rows: 1fr auto;
    gap: 2vh 4vw;
    padding: max(4vh, env(safe-area-inset-top)) max(5vw, env(safe-area-inset-right)) max(4vh, env(safe-area-inset-bottom)) max(5vw, env(safe-area-inset-left));
    transition: opacity 1.5s ease, transform 2s ease;
  }

  /* Horloge */
  .clock { display: flex; flex-direction: column; justify-content: center; }
  .time { font-size: 26vh; font-weight: 200; letter-spacing: -0.03em; line-height: .95; font-variant-numeric: tabular-nums; }
  .time .sec { font-size: .28em; opacity: .55; margin-left: .15em; font-weight: 300; vertical-align: top; position: relative; top: .5em; }
  .date { font-size: 6vh; font-weight: 400; opacity: .85; margin-top: 2vh; text-transform: capitalize; }
  .prayer { font-size: 5vh; margin-top: 1.5vh; display: none; align-items: baseline; gap: .5em; flex-wrap: wrap; }
  .prayer.on { display: flex; }
  .prayer b { font-weight: 600; }
  .prayer .left { color: #ffe08a; font-variant-numeric: tabular-nums; }
  .prayer .mq { flex-basis: 100%; font-size: .6em; opacity: .65; text-transform: capitalize; }
  .city {
    font-size: 4.4vh; margin-top: 2vh; align-self: flex-start;
    display: inline-flex; align-items: center; gap: .4em;
    padding: .45em 1em; border-radius: 999px;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3);
    cursor: pointer;
  }
  .city:active { background: rgba(255,255,255,.35); }

  /* Météo actuelle */
  .now { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; text-align: right; }
  .now-top { display: flex; align-items: center; gap: 3vw; }
  .now-icon { font-size: 20vh; line-height: 1; filter: drop-shadow(0 4px 12px rgba(0,0,0,.25)); }
  .now-temp { font-size: 22vh; font-weight: 200; line-height: 1; }
  .now-temp sup { font-size: .4em; vertical-align: top; position: relative; top: .25em; opacity: .8; }
  .now-desc { font-size: 5.5vh; margin-top: 1vh; }
  .now-details { font-size: 4vh; opacity: .75; margin-top: 1.2vh; display: flex; gap: 3vw; flex-wrap: wrap; justify-content: flex-end; }

  /* Prévisions */
  .forecast {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between;
    background: rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 4vh;
    padding: 2.2vh 2vw;
  }
  .fc { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .6vh; }
  .fc .l { font-size: 3.6vh; opacity: .75; text-transform: capitalize; }
  .fc .i { font-size: 6.5vh; line-height: 1.1; }
  .fc .t { font-size: 4vh; font-variant-numeric: tabular-nums; }
  .fc .t .min { opacity: .55; margin-left: .3em; }
  .fc .p { font-size: 2.8vh; color: #9fd3ff; min-height: 1.2em; }
  .tabhint { position: absolute; bottom: 1vh; left: 0; right: 0; text-align: center; font-size: 2.4vh; opacity: .35; pointer-events: none; }

  .msg { font-size: 4vh; opacity: .7; }

  /* Paramètres ville */
  #settings {
    position: fixed; inset: 0; background: rgba(0,0,0,.85);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #settings.open { display: flex; }
  .panel { width: min(90vw, 520px); background: #1c1f2a; border-radius: 18px; padding: 20px; }
  .panel h2 { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
  .panel form { display: flex; gap: 8px; }
  .panel input {
    flex: 1; font-size: 18px; padding: 10px 14px; border-radius: 12px; border: none;
    background: #2c3140; color: #fff; outline: none; -webkit-user-select: text; user-select: text;
  }
  .panel button { font-size: 17px; padding: 10px 16px; border-radius: 12px; border: none; background: #3b82f6; color: #fff; }
  .panel button.ghost { background: transparent; color: #aaa; margin-top: 12px; width: 100%; }
  #results { margin-top: 10px; max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #results div { padding: 12px 8px; border-bottom: 1px solid #2c3140; font-size: 17px; }
  #results div small { opacity: .55; }

  /* Portrait */
  @media (orientation: portrait) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; gap: 4vh; padding-top: max(8vh, env(safe-area-inset-top)); }
    .time { font-size: 24vw; }
    .date { font-size: 6vw; }
    .city { font-size: 4.5vw; }
    .now { align-items: flex-start; text-align: left; }
    .now-details { justify-content: flex-start; font-size: 4vw; }
    .now-icon { font-size: 22vw; }
    .now-temp { font-size: 24vw; }
    .now-desc { font-size: 6vw; }
    .forecast { align-self: end; border-radius: 5vw; padding: 3vw 2vw; }
    .fc .l { font-size: 3.6vw; } .fc .i { font-size: 7vw; } .fc .t { font-size: 3.8vw; } .fc .p { font-size: 3vw; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="shade"></div>
<div id="app">
  <section class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
    <div class="prayer" id="prayer"></div>
    <div class="city" id="city">📍 Choisir une ville</div>
  </section>

  <section class="now" id="now">
    <div class="msg">Chargement de la météo…</div>
  </section>

  <section class="forecast" id="forecast"></section>
</div>

<div id="settings">
  <div class="panel">
    <h2>Ville pour la météo</h2>
    <button id="useMyLoc" style="width:100%;margin-bottom:12px;background:#10b981">📍 Utiliser ma position</button>
    <form id="searchForm">
      <input id="q" type="text" placeholder="Ex : Paris, Tunis, Lyon…" autocomplete="off">
      <button type="submit">Chercher</button>
    </form>
    <div id="results"></div>
    <button class="ghost" id="closeSettings">Fermer</button>
  </div>
</div>

<script>
/* ---------- Fond animé selon la météo ---------- */
window.Sky = (function () {
  "use strict";
  var cv = document.getElementById("sky");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, dpr = 1;
  var kind = "clear", night = true, phase = "night";
  var clouds = [], drops = [], flakes = [], stars = [], fogs = [];
  var flash = 0, nextFlash = 0, last = 0, t = 0;

  // Couleurs du ciel [haut, bas]
  var PAL = {
    "clear-day":     ["#1767d4", "#7fbcff"],
    "clear-dusk":    ["#2b3f8f", "#f3a56f"],
    "clear-night":   ["#040918", "#18264f"],
    "partly-day":    ["#2f6fc4", "#9cc2ec"],
    "partly-dusk":   ["#38427a", "#d99a77"],
    "partly-night":  ["#070c1c", "#1f2b4a"],
    "cloudy-day":    ["#55657a", "#9aa8b8"],
    "cloudy-night":  ["#0d131d", "#263040"],
    "fog-day":       ["#6a7580", "#9ba4ad"],
    "fog-night":     ["#161a20", "#30363e"],
    "drizzle-day":   ["#465568", "#7d8ca0"],
    "drizzle-night": ["#0b1018", "#202a38"],
    "rain-day":      ["#333e4f", "#647286"],
    "rain-night":    ["#080c14", "#1b2330"],
    "storm-day":     ["#1f2333", "#454b63"],
    "storm-night":   ["#05060c", "#171a27"],
    "snow-day":      ["#5a6f8a", "#a4b4c6"],
    "snow-night":    ["#121a2a", "#33415a"]
  };
  var curTop = hex("#040918"), curBot = hex("#18264f"), tgtTop = curTop, tgtBot = curBot;

  function hex(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function lerp(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
  function rgb(c) { return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")"; }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  // Nuage pré-dessiné (rapide à afficher)
  function makeCloud(shade) {
    var c = document.createElement("canvas");
    c.width = 420; c.height = 210;
    var g = c.getContext("2d");
    var blobs = [[95, 135, 62], [160, 105, 80], [240, 95, 90], [315, 120, 70], [365, 145, 45], [200, 150, 75], [120, 160, 50], [285, 160, 60]];
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      var r = g.createRadialGradient(b[0], b[1], 0, b[0], b[1], b[2]);
      r.addColorStop(0, "rgba(" + shade + ",.95)");
      r.addColorStop(.55, "rgba(" + shade + ",.6)");
      r.addColorStop(1, "rgba(" + shade + ",0)");
      g.fillStyle = r;
      g.beginPath(); g.arc(b[0], b[1], b[2], 0, 6.2832); g.fill();
    }
    return c;
  }
  var CLOUD_LIGHT = makeCloud("255,255,255");
  var CLOUD_GREY = makeCloud("175,185,200");
  var CLOUD_DARK = makeCloud("85,95,112");

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function build() {
    var area = (W * H) / (667 * 375);
    clouds = []; drops = []; flakes = []; stars = []; fogs = [];
    var nClouds = { clear: 0, partly: 4, cloudy: 8, fog: 2, drizzle: 7, rain: 8, storm: 9, snow: 6 }[kind] || 0;
    var sprite = (kind === "partly" || kind === "clear") ? CLOUD_LIGHT : (kind === "storm" || kind === "rain") ? CLOUD_DARK : CLOUD_GREY;
    if (night && sprite === CLOUD_LIGHT) sprite = CLOUD_GREY;
    for (var i = 0; i < nClouds; i++) {
      var s = rnd(.6, 1.4) * Math.max(W / 900, .7);
      clouds.push({ x: rnd(-420 * s, W), y: rnd(-60, H * .45), s: s, v: rnd(4, 12) * (kind === "storm" ? 2 : 1), a: rnd(.35, .8) * (night ? .55 : 1), img: sprite });
    }
    if (night && (kind === "clear" || kind === "partly")) {
      for (i = 0; i < 140 * area; i++) stars.push({ x: rnd(0, W), y: rnd(0, H * .85), r: rnd(.4, 1.5), p: rnd(0, 6.28), f: rnd(.6, 2) });
    }
    var nDrops = { drizzle: 70, rain: 170, storm: 260 }[kind] || 0;
    for (i = 0; i < nDrops * area; i++) drops.push(newDrop(true));
    if (kind === "snow") for (i = 0; i < 110 * area; i++) flakes.push(newFlake(true));
    if (kind === "fog") for (i = 0; i < 6; i++) fogs.push({ x: rnd(-W, W), y: rnd(H * .1, H * .95), w: rnd(W * .8, W * 1.6), h: rnd(H * .18, H * .35), v: rnd(6, 16) });
  }

  function newDrop(anywhere) {
    var heavy = kind === "storm" ? 1.25 : kind === "drizzle" ? .55 : 1;
    return { x: rnd(-50, W + 50), y: anywhere ? rnd(-H, H) : rnd(-60, -10), l: rnd(10, 22) * heavy, v: rnd(650, 950) * heavy, a: rnd(.15, .4) };
  }
  function newFlake(anywhere) {
    return { x: rnd(0, W), y: anywhere ? rnd(-H, H) : -10, r: rnd(1, 3.4), v: rnd(25, 70), p: rnd(0, 6.28), sw: rnd(10, 30) };
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, W * .25, H);
    g.addColorStop(0, rgb(curTop)); g.addColorStop(1, rgb(curBot));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function drawSun() {
    var x = W * .5, y = -H * .05;
    if (phase === "dusk") { x = W * .2; y = H * .95; }
    var pulse = 1 + Math.sin(t * .6) * .04;
    var R = Math.max(W, H) * .55 * pulse;
    var g = ctx.createRadialGradient(x, y, 0, x, y, R);
    var warm = phase === "dusk" ? "255,190,120" : "255,236,180";
    var k = kind === "partly" ? .7 : 1;
    g.addColorStop(0, "rgba(" + warm + "," + .55 * k + ")");
    g.addColorStop(.25, "rgba(" + warm + "," + .18 * k + ")");
    g.addColorStop(1, "rgba(" + warm + ",0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // rayons doux en rotation lente
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * .02);
    ctx.globalAlpha = .06 * k;
    ctx.fillStyle = "#fff6d8";
    for (var i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R * 1.2, -R * .06); ctx.lineTo(R * 1.2, R * .06); ctx.closePath(); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawMoon() {
    var x = W * .5, y = H * .08, r = Math.min(W, H) * .07;
    var g = ctx.createRadialGradient(x, y, r * .5, x, y, r * 7);
    g.addColorStop(0, "rgba(200,215,255,.22)"); g.addColorStop(1, "rgba(200,215,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var S = Math.ceil(r * 2 + 4);
    if (!drawMoon.img || drawMoon.S !== S) {
      var m = document.createElement("canvas"); m.width = m.height = S * 2;
      var mg = m.getContext("2d"); mg.scale(2, 2);
      mg.fillStyle = "rgba(240,244,255,.92)";
      mg.beginPath(); mg.arc(S / 2, S / 2, r, 0, 6.2832); mg.fill();
      mg.globalCompositeOperation = "destination-out";
      mg.beginPath(); mg.arc(S / 2 + r * .45, S / 2 - r * .2, r * .92, 0, 6.2832); mg.fill();
      drawMoon.img = m; drawMoon.S = S;
    }
    ctx.drawImage(drawMoon.img, x - S / 2, y - S / 2, S, S);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 33) return; // ~30 images/s : économise la batterie
    var dt = Math.min((now - last) / 1000, .1);
    last = now; t += dt;

    curTop = lerp(curTop, tgtTop, .03); curBot = lerp(curBot, tgtBot, .03);
    drawSky();

    var i, o;
    for (i = 0; i < stars.length; i++) {
      o = stars[i];
      ctx.globalAlpha = .35 + .65 * Math.abs(Math.sin(t * o.f + o.p));
      ctx.fillStyle = "#fff";
      ctx.fillRect(o.x, o.y, o.r, o.r);
    }
    ctx.globalAlpha = 1;

    if (kind === "clear" || kind === "partly") { if (night) drawMoon(); else drawSun(); }

    for (i = 0; i < clouds.length; i++) {
      o = clouds[i];
      o.x += o.v * dt;
      if (o.x > W + 20) { o.x = -420 * o.s - rnd(0, 200); o.y = rnd(-60, H * .45); }
      ctx.globalAlpha = o.a;
      ctx.drawImage(o.img, o.x, o.y, 420 * o.s, 210 * o.s);
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < fogs.length; i++) {
      o = fogs[i];
      o.x += o.v * dt;
      if (o.x > W) o.x = -o.w;
      var fg = ctx.createRadialGradient(o.x + o.w / 2, o.y, 0, o.x + o.w / 2, o.y, o.w / 2);
      fg.addColorStop(0, "rgba(230,235,240,.28)"); fg.addColorStop(1, "rgba(230,235,240,0)");
      ctx.fillStyle = fg;
      ctx.save(); ctx.translate(0, o.y); ctx.scale(1, o.h / o.w); ctx.translate(0, -o.y);
      ctx.fillRect(o.x, o.y - o.w / 2, o.w, o.w); ctx.restore();
    }

    if (drops.length) {
      ctx.strokeStyle = night ? "rgba(170,190,220,.35)" : "rgba(220,232,250,.45)";
      ctx.lineWidth = kind === "drizzle" ? 1 : 1.3;
      ctx.beginPath();
      for (i = 0; i < drops.length; i++) {
        o = drops[i];
        o.y += o.v * dt; o.x -= o.v * .18 * dt;
        if (o.y > H + 20) drops[i] = o = newDrop(false);
        ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.l * .18, o.y - o.l);
      }
      ctx.stroke();
    }

    if (flakes.length) {
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.beginPath();
      for (i = 0; i < flakes.length; i++) {
        o = flakes[i];
        o.y += o.v * dt; o.p += dt;
        var fx = o.x + Math.sin(o.p) * o.sw;
        if (o.y > H + 10) flakes[i] = o = newFlake(false);
        ctx.moveTo(fx + o.r, o.y); ctx.arc(fx, o.y, o.r, 0, 6.2832);
      }
      ctx.fill();
    }

    if (kind === "storm") {
      if (t > nextFlash) { flash = 1; nextFlash = t + rnd(4, 11); if (Math.random() < .5) setTimeout(function () { flash = .8; }, 160); }
      if (flash > .01) {
        ctx.fillStyle = "rgba(220,230,255," + flash * .45 + ")";
        ctx.fillRect(0, 0, W, H);
        flash *= .82;
      }
    }
  }

  function set(k, isNight, isDusk) {
    var changed = k !== kind || isNight !== night;
    kind = k; night = isNight;
    phase = isNight ? "night" : (isDusk && (k === "clear" || k === "partly") ? "dusk" : "day");
    var key = k + "-" + phase;
    if (!PAL[key]) key = k + "-" + (isNight ? "night" : "day");
    var p = PAL[key] || PAL["clear-day"];
    tgtTop = hex(p[0]); tgtBot = hex(p[1]);
    if ((set.n = (set.n || 0) + 1) <= 2) { curTop = tgtTop; curBot = tgtBot; }
    if (changed) build();
  }

  function kindFromCode(c) {
    if (c <= 1) return "clear";
    if (c === 2) return "partly";
    if (c === 3) return "cloudy";
    if (c === 45 || c === 48) return "fog";
    if (c >= 51 && c <= 57) return "drizzle";
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
    if (c >= 95) return "storm";
    return "rain";
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
  return { set: set, kindFromCode: kindFromCode };
})();
</script>
<script>
(function () {
  "use strict";

  var STORE_KEY = "dock.location";
  var REFRESH_MS = 15 * 60 * 1000;
  var showSeconds = true;
  var forecastMode = "hours"; // "hours" | "days"
  var lastData = null;

  // ---------- Codes météo WMO -> icône + texte ----------
  function wmo(code, isDay) {
    var d = isDay !== 0;
    var map = {
      0:  [d ? "☀️" : "🌙", "Ciel dégagé"],
      1:  [d ? "🌤️" : "🌙", "Plutôt dégagé"],
      2:  [d ? "⛅" : "☁️", "Partiellement nuageux"],
      3:  ["☁️", "Couvert"],
      45: ["🌫️", "Brouillard"],
      48: ["🌫️", "Brouillard givrant"],
      51: ["🌦️", "Bruine légère"],
      53: ["🌦️", "Bruine"],
      55: ["🌧️", "Bruine forte"],
      56: ["🌧️", "Bruine verglaçante"],
      57: ["🌧️", "Bruine verglaçante"],
      61: ["🌦️", "Pluie faible"],
      63: ["🌧️", "Pluie"],
      65: ["🌧️", "Forte pluie"],
      66: ["🌧️", "Pluie verglaçante"],
      67: ["🌧️", "Pluie verglaçante"],
      71: ["🌨️", "Neige faible"],
      73: ["🌨️", "Neige"],
      75: ["❄️", "Forte neige"],
      77: ["🌨️", "Grains de neige"],
      80: ["🌦️", "Averses"],
      81: ["🌧️", "Averses"],
      82: ["⛈️", "Fortes averses"],
      85: ["🌨️", "Averses de neige"],
      86: ["❄️", "Averses de neige"],
      95: ["⛈️", "Orage"],
      96: ["⛈️", "Orage avec grêle"],
      99: ["⛈️", "Orage avec grêle"]
    };
    return map[code] || ["🌡️", "—"];
  }

  function themeFor(code, isDay) {
    var rainy = code >= 51;
    var cloudy = code >= 2 && code < 51;
    if (!isDay) return (rainy || cloudy) ? "night-cloud" : "night-clear";
    if (rainy) return "day-rain";
    if (cloudy) return "day-cloud";
    return "day-clear";
  }

  // ---------- Prières ----------
  var PRAYERS = [["Fajr", "Fajr"], ["Dhuhr", "Dhuhr"], ["Asr", "Asr"], ["Maghrib", "Maghrib"], ["Isha", "Isha"]];
  var prayerTimes = []; // [{name, date}]
  var prayerKey = "";

  function ddmmyyyy(d) { return pad(d.getDate()) + "-" + pad(d.getMonth() + 1) + "-" + d.getFullYear(); }

  var mosque = null; // horaires de la mosquée (mosque.json), si configurée

  function mosqueDay(d) {
    var cal = mosque.calendar && mosque.calendar[d.getMonth()];
    var row = cal && cal[String(d.getDate())];
    if (!row) return null;
    var idx = [0, 2, 3, 4, 5]; // fajr, dhuhr, asr, maghrib, isha (on saute shuruq)
    return PRAYERS.map(function (p, i) {
      var t = row[idx[i]];
      var name = p[1];
      if (i === 1 && d.getDay() === 5 && mosque.jumua) { t = mosque.jumua; name = "Jumu'a"; }
      var hm = t.split(":");
      return { name: name, date: new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hm[0], +hm[1], 0) };
    });
  }

  function loadPrayers(lat, lon, tz) {
    var today = new Date();
    if (mosque) {
      var a = mosqueDay(today), b = mosqueDay(new Date(today.getTime() + 86400000));
      if (a && b) { prayerTimes = a.concat(b); updatePrayer(today); return; }
    }
    var key = lat.toFixed(2) + "," + lon.toFixed(2) + "," + today.toDateString();
    if (key === prayerKey && prayerTimes.length) return;
    // France : méthode UOIF (12), sinon Ligue islamique mondiale (3)
    var method = /^Europe\/Paris$/.test(tz || "") ? 12 : 3;
    var tomorrow = new Date(today.getTime() + 86400000);
    var get = function (d) {
      return fetch("https://api.aladhan.com/v1/timings/" + ddmmyyyy(d) + "?latitude=" + lat + "&longitude=" + lon + "&method=" + method)
        .then(function (r) { return r.json(); })
        .then(function (j) {
          return PRAYERS.map(function (p) {
            var hm = j.data.timings[p[0]].slice(0, 5).split(":");
            var t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hm[0], +hm[1], 0);
            return { name: p[1], date: t };
          });
        });
    };
    Promise.all([get(today), get(tomorrow)]).then(function (res) {
      prayerTimes = res[0].concat(res[1]);
      prayerKey = key;
      updatePrayer(new Date());
    }).catch(function () {});
  }

  function updatePrayer(now) {
    var el = document.getElementById("prayer");
    if (!el || !prayerTimes.length) return;
    var next = null;
    for (var i = 0; i < prayerTimes.length; i++) {
      if (prayerTimes[i].date > now) { next = prayerTimes[i]; break; }
    }
    if (!next) { el.classList.remove("on"); return; }
    var mins = Math.ceil((next.date - now) / 60000);
    var h = Math.floor(mins / 60), m = mins % 60;
    var left = h > 0 ? h + " h " + pad(m) + " min" : m + " min";
    var hhmm = pad(next.date.getHours()) + ":" + pad(next.date.getMinutes());
    el.innerHTML = '🕌 <b>' + next.name + '</b> ' + hhmm + ' <span class="left">dans ' + left + '</span>' +
      (mosque ? '<span class="mq">' + mosque.name + '</span>' : '');
    el.classList.add("on");
    // Recharger les horaires quand on change de jour
    if (now.getHours() === 0 && now.getMinutes() === 5 && lastData) loadPrayers(lastData.latitude, lastData.longitude, lastData.timezone);
  }

  // ---------- Horloge ----------
  var timeEl = document.getElementById("time");
  var dateEl = document.getElementById("date");
  var dateFmt = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" });

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function tick() {
    var now = new Date();
    var html = pad(now.getHours()) + ":" + pad(now.getMinutes());
    if (showSeconds) html += '<span class="sec">' + pad(now.getSeconds()) + "</span>";
    timeEl.innerHTML = html;
    dateEl.textContent = dateFmt.format(now);

    updatePrayer(now);

    // Mode nuit : écran atténué entre 22h et 7h
    var h = now.getHours();
    document.body.classList.toggle("dim", h >= 22 || h < 7);
  }
  tick();
  setInterval(tick, 1000);

  timeEl.addEventListener("click", function () { showSeconds = !showSeconds; tick(); });

  // ---------- Localisation ----------
  function getLoc() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; }
  }
  function setLoc(loc) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(loc)); } catch (e) {}
  }

  var cityEl = document.getElementById("city");
  var settings = document.getElementById("settings");
  var resultsEl = document.getElementById("results");
  var qEl = document.getElementById("q");

  function openSettings() { settings.classList.add("open"); resultsEl.innerHTML = ""; setTimeout(function () { qEl.focus(); }, 50); }
  function closeSettings() { settings.classList.remove("open"); qEl.blur(); }

  cityEl.addEventListener("click", openSettings);
  document.getElementById("closeSettings").addEventListener("click", closeSettings);
  document.getElementById("useMyLoc").addEventListener("click", function () {
    setLoc({ auto: true });
    autoLoc = null;
    closeSettings();
    loadWeather();
  });

  document.getElementById("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = qEl.value.trim();
    if (!q) return;
    resultsEl.innerHTML = '<div>Recherche…</div>';
    fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&language=fr&format=json&name=" + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        resultsEl.innerHTML = "";
        if (!j.results || !j.results.length) { resultsEl.innerHTML = "<div>Aucun résultat</div>"; return; }
        j.results.forEach(function (r) {
          var div = document.createElement("div");
          var sub = [r.admin1, r.country].filter(Boolean).join(", ");
          div.innerHTML = r.name + " <small>" + sub + "</small>";
          div.addEventListener("click", function () {
            setLoc({ name: r.name, lat: r.latitude, lon: r.longitude });
            closeSettings();
            loadWeather();
          });
          resultsEl.appendChild(div);
        });
      })
      .catch(function () { resultsEl.innerHTML = "<div>Erreur réseau</div>"; });
  });

  // ---------- Météo ----------
  var nowEl = document.getElementById("now");
  var fcEl = document.getElementById("forecast");
  var dayFmt = new Intl.DateTimeFormat("fr-FR", { weekday: "short" });

  // Position automatique : GPS si possible (HTTPS), sinon via l'adresse IP
  function locateMe() {
    return new Promise(function (resolve, reject) {
      var byIp = function () {
        fetch("https://get.geojs.io/v1/ip/geo.json")
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (!j.latitude) throw new Error("no ip loc");
            resolve({ name: j.city || j.region || "Ma position", lat: +j.latitude, lon: +j.longitude });
          })
          .catch(reject);
      };
      if (window.isSecureContext && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (p) {
          var lat = p.coords.latitude, lon = p.coords.longitude;
          fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=fr&latitude=" + lat + "&longitude=" + lon)
            .then(function (r) { return r.json(); })
            .then(function (j) { resolve({ name: j.city || j.locality || "Ma position", lat: lat, lon: lon }); })
            .catch(function () { resolve({ name: "Ma position", lat: lat, lon: lon }); });
        }, byIp, { timeout: 10000, maximumAge: 30 * 60 * 1000 });
      } else {
        byIp();
      }
    });
  }

  var autoLoc = null;

  function loadWeather() {
    var loc = getLoc();
    if (!loc || loc.auto) {
      if (!autoLoc) cityEl.textContent = "📍 Localisation…";
      locateMe()
        .then(function (l) { autoLoc = l; fetchWeather(l, true); })
        .catch(function () {
          if (autoLoc) { fetchWeather(autoLoc, true); return; }
          cityEl.textContent = "📍 Choisir une ville";
          nowEl.innerHTML = '<div class="msg">Position introuvable — touchez « Choisir une ville »</div>';
          setTimeout(loadWeather, 60 * 1000);
        });
      return;
    }
    fetchWeather(loc, false);
  }

  function fetchWeather(loc, isAuto) {
    cityEl.textContent = (isAuto ? "📍 " : "🏙️ ") + loc.name + "  ⚙︎";

    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
      "&hourly=temperature_2m,weather_code,precipitation_probability,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset" +
      "&timezone=auto&forecast_days=7";

    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (d) { lastData = d; render(); loadPrayers(d.latitude, d.longitude, d.timezone); })
      .catch(function () {
        if (!lastData) nowEl.innerHTML = '<div class="msg">Pas de connexion… nouvel essai bientôt</div>';
        setTimeout(loadWeather, 60 * 1000);
      });
  }

  // Aperçu possible : ?meteo=clear|partly|cloudy|fog|drizzle|rain|storm|snow &nuit=1 &crepuscule=1
  var params = {};
  location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { params[k] = decodeURIComponent(v); });
  var ALIAS = { soleil: "clear", nuageux: "cloudy", pluie: "rain", orage: "storm", neige: "snow", brouillard: "fog", bruine: "drizzle", eclaircies: "partly" };

  function minutesOf(iso) { return +iso.slice(11, 13) * 60 + +iso.slice(14, 16); }

  function updateSky() {
    var d = lastData;
    var kind = "clear", isNight = true, isDusk = false;
    if (d && d.current) {
      kind = Sky.kindFromCode(d.current.weather_code);
      isNight = d.current.is_day === 0;
      var now = minutesOf(d.current.time);
      var rise = minutesOf(d.daily.sunrise[0]), set = minutesOf(d.daily.sunset[0]);
      isDusk = Math.abs(now - rise) < 50 || Math.abs(now - set) < 50;
    }
    if (params.meteo) { kind = ALIAS[params.meteo] || params.meteo; isNight = params.nuit === "1"; isDusk = params.crepuscule === "1"; }
    Sky.set(kind, isNight, isDusk);
  }
  updateSky();

  function render() {
    var d = lastData;
    if (!d || !d.current) return;
    var c = d.current;
    var w = wmo(c.weather_code, c.is_day);
    updateSky();

    var sunrise = d.daily.sunrise[0].slice(11, 16);
    var sunset = d.daily.sunset[0].slice(11, 16);

    nowEl.innerHTML =
      '<div class="now-top"><div class="now-icon">' + w[0] + '</div>' +
      '<div class="now-temp">' + Math.round(c.temperature_2m) + '<sup>°</sup></div></div>' +
      '<div class="now-desc">' + w[1] + '</div>' +
      '<div class="now-details">' +
        '<span>↑' + Math.round(d.daily.temperature_2m_max[0]) + '° ↓' + Math.round(d.daily.temperature_2m_min[0]) + '°</span>' +
        '<span>Ressenti ' + Math.round(c.apparent_temperature) + '°</span>' +
        '<span>💧 ' + c.relative_humidity_2m + '%</span>' +
        '<span>💨 ' + Math.round(c.wind_speed_10m) + ' km/h</span>' +
      '</div>' +
      '<div class="now-details"><span>🌅 ' + sunrise + '</span><span>🌇 ' + sunset + '</span></div>';

    renderForecast();
  }

  function renderForecast() {
    var d = lastData;
    if (!d) return;
    var html = "";
    if (forecastMode === "hours") {
      // Trouver l'heure actuelle dans la liste horaire
      var nowIso = d.current.time.slice(0, 13);
      var start = 0;
      for (var i = 0; i < d.hourly.time.length; i++) {
        if (d.hourly.time[i].slice(0, 13) >= nowIso) { start = i; break; }
      }
      for (var k = 1; k <= 7; k++) {
        var idx = start + k * 2 - 1; // toutes les 2 heures
        if (idx >= d.hourly.time.length) break;
        var wi = wmo(d.hourly.weather_code[idx], d.hourly.is_day[idx]);
        var p = d.hourly.precipitation_probability[idx];
        html += '<div class="fc"><div class="l">' + d.hourly.time[idx].slice(11, 13) + 'h</div>' +
          '<div class="i">' + wi[0] + '</div>' +
          '<div class="t">' + Math.round(d.hourly.temperature_2m[idx]) + '°</div>' +
          '<div class="p">' + (p >= 20 ? p + "%" : "") + '</div></div>';
      }
    } else {
      for (var j = 1; j < d.daily.time.length; j++) {
        var wd = wmo(d.daily.weather_code[j], 1);
        var dt = new Date(d.daily.time[j] + "T12:00:00");
        var pp = d.daily.precipitation_probability_max[j];
        html += '<div class="fc"><div class="l">' + dayFmt.format(dt).replace(".", "") + '</div>' +
          '<div class="i">' + wd[0] + '</div>' +
          '<div class="t">' + Math.round(d.daily.temperature_2m_max[j]) + '°<span class="min">' + Math.round(d.daily.temperature_2m_min[j]) + '°</span></div>' +
          '<div class="p">' + (pp >= 20 ? pp + "%" : "") + '</div></div>';
      }
    }
    fcEl.innerHTML = html;
  }

  // Toucher la barre de prévisions : heures <-> jours
  fcEl.addEventListener("click", function () {
    forecastMode = forecastMode === "hours" ? "days" : "hours";
    renderForecast();
  });
  // Toucher la météo actuelle : rafraîchir
  nowEl.addEventListener("click", loadWeather);

  // Horaires de la mosquée (fichier mis à jour chaque semaine par GitHub)
  fetch("mosque.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (m) { if (m && m.calendar) { mosque = m; prayerKey = ""; if (lastData) loadPrayers(lastData.latitude, lastData.longitude, lastData.timezone); } })
    .catch(function () {});

  loadWeather();
  setInterval(loadWeather, REFRESH_MS);

  // Recharger quand l'écran revient (après veille / retour dans l'app)
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { tick(); loadWeather(); }
  });

  // Léger décalage anti-marquage toutes les 10 min
  setInterval(function () {
    var x = Math.round(Math.random() * 6 - 3), y = Math.round(Math.random() * 6 - 3);
    document.getElementById("app").style.transform = "translate(" + x + "px," + y + "px)";
  }, 10 * 60 * 1000);
})();
</script>
</body>
</html>
